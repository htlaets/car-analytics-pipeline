services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cars}
      POSTGRES_USER: ${POSTGRES_USER:-cars}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cars}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cars -d cars"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  pipeline:
    image: apache/spark:3.5.3-python3
    user: root
    working_dir: /project
    command: ["/opt/spark/bin/spark-submit", "jobs/cars_etl.py", "--input", "data/sample/cars.csv", "--output", "build/lake"]
    volumes: [".:/project"]

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://cars:cars@postgres/cars
      AIRFLOW_CONN_CARS_WAREHOUSE: postgresql://cars:cars@postgres:5432/cars
    command: standalone
    ports: ["8080:8080"]
    volumes:
      - .:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - ./sql:/opt/airflow/dags/sql

  superset:
    image: apache/superset:4.1.1
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8088:8088"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-development-secret-change-me}
    command:
      - /bin/sh
      - -c
      - >-
        superset db upgrade &&
        (superset fab create-admin --username admin --firstname Data --lastname Engineer
        --email admin@example.com --password admin || true) &&
        superset init &&
        gunicorn --bind 0.0.0.0:8088 'superset.app:create_app()'

volumes:
  postgres_data:
