[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "car-analytics-pipeline"
version = "1.0.0"
description = "PySpark ETL pipeline for automotive analytics"
requires-python = ">=3.10,<3.13"
dependencies = ["pyspark==3.5.3"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.9.10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
